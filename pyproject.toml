[project]
name = "guestbook-workshop"
version = "0.1.0"
description = "Небольшая гостевая книга на FastAPI + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "pydantic-settings",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
